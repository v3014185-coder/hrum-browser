<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      background: #202124;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
    }
    .splash-container {
      text-align: center;
      animation: fadeIn 1s ease-in-out;
    }
    .logo {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      border: 4px solid #8ab4f8;
      animation: spin 2s linear infinite;
      object-fit: cover;
    }
    h1 {
      color: #e8eaed;
      margin-top: 20px;
      font-size: 28px;
      letter-spacing: 2px;
      animation: pulse 1.5s infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0% { opacity: 0.5; }
      50% { opacity: 1; }
      100% { opacity: 0.5; }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <img src="hrum.ico" class="logo" alt="Hrum Logo">
    <h1>Hrum Browser</h1>
  </div>
</body>
</html>
